<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SY2024-Welcome Kit</title>
    <link rel="stylesheet" href="./CSS/index.css">
</head>

<body>

    <header>
        <h1>Welcome to iACADEMY, </h1>
        <label class="switch">
            <input type="checkbox" id="modeSwitch">
            <span class="slider round"></span>
        </label>
    </header>

    <main>
        <section id="welcome">
            <h2>Hello!</h2>
            <div class="user-info">
                <form id="nameForm">
                    <label for="nameInput">Enter your full name: </label>
                    <input type="text" id="nameInput" name="nameInput" required>
                    <button type="submit">Submit</button>
                </form>

                <form id="school-course">
                    <label placeholder="egrsergs" for="school-course-select">Courses: </label>
                    <select id="school-course-select">
                        <optgroup label="School Of Computing (SOC)">
                            <option value="SOC">Software Engineering</option>
                            <option value="SOC">Cloud Engineering</option>
                            <option value="SOC">Web Development</option>
                            <option value="SOC">Game Development</option>
                            <option value="SOC">Data Science</option>
                        </optgroup>
                  
                        <optgroup label="School Of Design and Arts (SODA)">
                            <option value="SODA">Multimedia Arts</option>
                            <option value="SODA">Fashion Design</option>
                            <option value="SODA">Animation</option>
                            <option value="SODA">Music Production</option>
                            <option value="SODA">Film and Visual Effects</option>
                        </optgroup>

                        <optgroup label="School of Business and Liberal Arts">
                            <option value="SBLA">Marketing Management</option>
                            <option value="SBLA">E-Management</option>
                            <option value="SBLA">Real Estate Management</option>
                            <option value="SBLA">Psychology</option>
                            <option value="SBLA">Accountancy</option>
                        </optgroup>
        
    
    
                    </select>
                </form>
            </div>
        </section>

        <section id="content" style="display:none;">
            <h2>Welcome to iACADEMY</h2>
            <p id="personalizedMessage"></p>
            <!-- Other sections like About, Campus, etc. will be included here -->
          </section>
    </main>

    <footer>
        <p>&copy; SY2024 Welcome Kit by Group 2. All rights reserved.</p>
    </footer>

    <script src="./JavaScript/index.js"></script>
</body>

</html>
