<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to iACADEMY!</title>
    <link rel="icon" type="image/x-icon" href="./IMG/logo-blue.png">
    <link rel="stylesheet" href="./CSS/index.css">
</head>
<body>
    <header>
        <h1>Welcome to iACADEMY</h1>
        <label class="switch">
            <input type="checkbox" id="modeSwitch">
            <span class="slider round"></span>
        </label>
    </header>
    <main>
        <section id="welcome">
            <h2>Welcome to iACADEMY</h2>
            <div class="user-info">
                <form id="nameForm">
                    <label for="nameInput"></label>
                    <input placeholder="Enter Your Name" type="text" id="nameInput" name="nameInput" required><br>
                    <br>
                    <label for="yearLevel">Year Level:</label>
                    <select id="yearLevel" required>
                        <option value="">Select Year Level</option>
                        <option value="shs">Senior High School</option>
                        <option value="college">College</option>
                    </select>
                    <br>
                    <label for="courses">Courses:</label>
                    <select id="courses" required>
                        <option value="">Select Course</option>
                    </select>
                    <br><br>
                    <button type="submit" id="submitButton" disabled>Submit</button><br><br>
                    <p id="errorMessage" style="display:none;color:red;">Please fill out all fields.</p>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; SY2024 Welcome Kit by Group 2. All rights reserved.</p>
    </footer>
    <script src="./JavaScript/index.js"></script>
</body>
</html>
