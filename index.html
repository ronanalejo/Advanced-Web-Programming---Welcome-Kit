<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SY2024-Welcome Kit</title>
    <link rel="stylesheet" href="./CSS/index.css">
</head>

<body>

    <header>
        <h1>Welcome to iACADEMY, </h1>
        <label class="switch">
            <input type="checkbox" id="modeSwitch">
            <span class="slider round"></span>
        </label>
    </header>

    <main>
        <section id="welcome">
            <h2>Hello!</h2>
            <div class="user-info">
                <form id="nameForm">
                    <label for="nameInput">Enter your Full Name: </label>
                    <input type="text" id="nameInput" name="nameInput" required>
                    
                    <label for="yearLevel">Year Level:</label>
                    <select id="yearLevel">
                        <option value="">Select Year Level</option>
                        <option value="shs">Senior High School</option>
                        <option value="college">College</option>
                    </select>
                
                    <label for="courses">Courses:</label>
                    <select id="courses">
                        <option value="">Select Course</option>
                    </select>

                    <button type="submit" id="submitButton" disabled>Submit</button>
                </form>
                <p id="errorMessage" style="color: red; display: none;">Please fill in all required fields.</p>
            </div>
        </section>

        <section id="content" style="display:none;">
            <h2 id="welcomeMessage"></h2>
            <p id="personalizedMessage"></p>
            <!-- Other sections like About, Campus, etc. will be included here -->
        </section>
    </main>

    <footer>
        <p>&copy; SY2024 Welcome Kit by Group 2. All rights reserved.</p>
    </footer>

    <script src="./JavaScript/index.js"></script>
</body>

</html>
